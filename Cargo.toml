[package]
name = "laya-rust"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "laya"
path = "src/main.rs"

[features]
# One backend per build. `cuda` stays the default so the existing Linux
# workflow (`cargo build --release`) is unchanged. On macOS build with:
#   cargo build --release --no-default-features --features mlx
default = ["cuda"]
cuda = ["dep:cudarc"]
mlx = ["dep:mlx-rs", "dep:mlx-sys", "dep:safetensors"]
cpu = []

[dependencies]
clap = { version = "4.6", features = ["derive"] }
cudarc = { version = "0.19", features = ["driver", "runtime", "nvrtc", "cublas", "cuda-13030"], optional = true }
mlx-rs = { version = "0.32", default-features = false, features = ["metal", "accelerate", "safetensors"], optional = true }
mlx-sys = { version = "=0.6.0", optional = true }
safetensors = { version = "0.8", optional = true }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
tiny_http = "0.12"

[profile.release]
opt-level = 3
